{% extends "base.html" %}
{% set page_title = "Create Account" %}

{% block extra_css %}
<style>
    .auth-page-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
        background: var(--background);
    }
    .auth-container { width: 100%; max-width: 440px; }
    .auth-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 36px 32px 30px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }
    .auth-icon-ring {
        width: 62px; height: 62px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.55rem; margin: 0 auto 14px;
    }
    .user-ring {
        background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(139,92,246,0.15));
        color: var(--primary);
        border: 2px solid rgba(99,102,241,0.25);
    }
    .auth-alert {
        display: none; padding: 11px 14px; border-radius: 9px;
        font-size: 0.875rem; font-weight: 500; margin-bottom: 18px; line-height: 1.45;
    }
    .auth-alert.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
    .auth-alert.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #16a34a; }
    .auth-form-group { margin-bottom: 16px; }
    .auth-form-label {
        display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted);
        text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px;
    }
    .auth-form-input {
        width: 100%; padding: 11px 13px; background: var(--background-alt);
        border: 1.5px solid var(--border); border-radius: 9px;
        font-family: var(--font-main); font-size: 0.925rem; color: var(--text-primary);
        transition: border-color 0.2s ease, box-shadow 0.2s ease; box-sizing: border-box;
    }
    .auth-form-input:focus {
        outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .auth-form-input::placeholder { color: var(--text-muted); opacity: 0.6; }
    .auth-submit-btn {
        width: 100%; padding: 12px; border: none; border-radius: 10px;
        font-family: var(--font-main); font-weight: 700; font-size: 0.95rem;
        cursor: pointer; transition: all 0.2s ease;
        display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px;
    }
    .user-btn {
        background: linear-gradient(135deg, var(--primary), #8b5cf6);
        color: #fff; box-shadow: 0 2px 12px rgba(99,102,241,0.35);
    }
    .user-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(99,102,241,0.45); }
    .user-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .auth-divider { text-align: center; margin-top: 22px; font-size: 0.875rem; color: var(--text-muted); }
    .auth-divider a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .auth-divider a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-container">
        <div class="auth-card">

            <div id="regAlert" class="auth-alert error"></div>

            <div style="text-align: center; margin-bottom: 24px;">
                <div class="auth-icon-ring user-ring">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 style="font-size: 1.45rem; font-weight: 700; margin-bottom: 6px;">Create Account</h2>
                <p style="color: var(--text-muted); font-size: 0.875rem;">Start extracting insights from your documents today</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)" novalidate>

                <div class="auth-form-group">
                    <label class="auth-form-label" for="regName">
                        <i class="fa-solid fa-user" style="color: var(--primary); margin-right: 5px;"></i> Full Name
                    </label>
                    <input type="text" id="regName" class="auth-form-input"
                           placeholder="John Doe" required autocomplete="name">
                </div>

                <div class="auth-form-group">
                    <label class="auth-form-label" for="regEmail">
                        <i class="fa-solid fa-envelope" style="color: var(--primary); margin-right: 5px;"></i> Email Address
                    </label>
                    <input type="email" id="regEmail" class="auth-form-input"
                           placeholder="you@example.com" required autocomplete="username">
                </div>

                <div class="auth-form-group">
                    <label class="auth-form-label" for="regPassword">
                        <i class="fa-solid fa-lock" style="color: var(--primary); margin-right: 5px;"></i> Password
                    </label>
                    <input type="password" id="regPassword" class="auth-form-input"
                           placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
                </div>

                <div class="auth-form-group">
                    <label class="auth-form-label" for="regConfirmPassword">
                        <i class="fa-solid fa-lock" style="color: var(--primary); margin-right: 5px;"></i> Confirm Password
                    </label>
                    <input type="password" id="regConfirmPassword" class="auth-form-input"
                           placeholder="Repeat your password" minlength="6" required autocomplete="new-password">
                </div>

                <button type="submit" class="auth-submit-btn user-btn" id="registerBtn">
                    <i class="fa-solid fa-user-plus"></i> Create My Account
                </button>

            </form>

            <div class="auth-divider">
                Already have an account?
                <a href="/auth">Sign In</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function showRegAlert(message, type = 'error') {
        const alert = document.getElementById('regAlert');
        alert.className = `auth-alert ${type}`;
        const icon = type === 'error' ? 'circle-xmark' : 'circle-check';
        alert.innerHTML = `<i class="fa-solid fa-${icon}" style="margin-right:7px;"></i>${message}`;
        alert.style.display = 'block';
        alert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function handleRegister(event) {
        event.preventDefault();

        const name            = document.getElementById('regName').value.trim();
        const email           = document.getElementById('regEmail').value.trim();
        const password        = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;
        const btn             = document.getElementById('registerBtn');

        if (!name || !email || !password || !confirmPassword) {
            return showRegAlert('Please fill in all fields.');
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            return showRegAlert('Please enter a valid email address.');
        }
        if (password !== confirmPassword) {
            return showRegAlert('Passwords do not match.');
        }
        if (password.length < 6) {
            return showRegAlert('Password must be at least 6 characters.');
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating Account...';

        try {
            const res = await AuthManager.registerUser(name, email, password);
            if (res.success) {
                showRegAlert('Account created! Redirecting to dashboard...', 'success');
                setTimeout(() => window.location.href = res.redirect || '/dashboard', 700);
            } else {
                showRegAlert(res.message || 'Registration failed. Please try again.');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create My Account';
            }
        } catch (e) {
            showRegAlert('Network error. Please try again.');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create My Account';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('regName').focus();
    });
</script>
{% endblock %}
