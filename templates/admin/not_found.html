{% extends "base.html" %}

{% block title %}404 Not Found — Resource Unavailable{% endblock %}

{% block content %}
<section style="padding: 80px 0; min-height: 60vh; display: flex; align-items: center;">
    <div class="container" style="max-width: 600px; text-align: center;">
        <div class="saas-card" style="padding: 48px 32px;">
            <div style="width: 72px; height: 72px; border-radius: 50%; background: rgba(37, 99, 235, 0.1); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 20px;">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <h1 style="font-size: 1.8rem; margin-bottom: 12px;">Resource Not Found (404)</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px; line-height: 1.5;">
                The requested resource, page, or document record could not be found or has been moved.
            </p>
            <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
                <a href="{{ url_for('home') }}" class="btn btn-outline btn-md">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="{{ url_for('dashboard_page') }}" class="btn btn-primary btn-md">
                    <i class="fa-solid fa-gauge"></i> Dashboard
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
